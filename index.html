<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Utkarsh Singh | Library</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%2314171F'/%3E%3Ctext x='32' y='41' font-family='Georgia,serif' font-size='23' font-weight='600' fill='%23C9A227' text-anchor='middle'%3EUS%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#090b0b;
    --bg-soft:#101311;
    --panel:#141713;
    --panel-2:#191c17;
    --ink:#F0E2BF;
    --ink-soft:#C9B98E;
    --gold:#D5A649;
    --gold-2:#F1C46B;
    --muted:#8E8A78;
    --line:rgba(213,166,73,.24);
    --maxw:1280px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 80% 0%, rgba(126,76,24,.16), transparent 30%),
      linear-gradient(180deg,#080a09 0%,#0b0d0b 50%,#080908 100%);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    line-height:1.5;
  }
  body::before{
    content:'';position:fixed;inset:0;pointer-events:none;z-index:-1;
    background-image:linear-gradient(rgba(255,255,255,.012) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.01) 1px,transparent 1px);
    background-size:48px 48px;
    mask-image:linear-gradient(to bottom,rgba(0,0,0,.8),transparent 75%);
  }
  a{color:inherit;text-decoration:none}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 38px}
  h1,h2,h3{font-family:'Fraunces',serif;font-weight:500;letter-spacing:-.02em}

  .topbar{
    height:76px;display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid rgba(213,166,73,.12);
  }
  .topbar::after{content:'THE LIBRARY';font-family:'Fraunces',serif;font-size:14px;letter-spacing:.08em;color:var(--ink-soft)}
  .back-link{font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#8f948a;transition:.2s}
  .back-link:hover{color:var(--gold-2)}

  .library-hero{
    min-height:360px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden;
    border-bottom:1px solid var(--line);
  }
  .library-hero::before{
    content:'';position:absolute;inset:0;
    background:
      linear-gradient(90deg,rgba(7,8,7,.98) 0%,rgba(7,8,7,.8) 45%,rgba(7,8,7,.08) 100%),
      url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?auto=format&fit=crop&w=1800&q=85') center 44%/cover;
    filter:saturate(.65) brightness(.48);
    z-index:-2;
  }
  .library-hero::after{
    content:'';position:absolute;right:9%;bottom:42px;width:190px;height:190px;border-radius:50%;
    background:radial-gradient(circle,rgba(240,174,73,.22),rgba(240,174,73,.06) 45%,transparent 70%);
    filter:blur(8px);z-index:-1;
  }
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:12px}
  .eyebrow::before{content:'';width:32px;height:1px;background:var(--gold)}
  .library-hero h1{font-size:clamp(54px,7vw,92px);line-height:.95;color:#F5DEAA;margin:14px 0 20px;text-transform:uppercase;text-shadow:0 8px 30px rgba(0,0,0,.35)}
  .library-hero p{font-family:'Fraunces',serif;font-size:18px;line-height:1.65;color:#d8c9a6;max-width:590px}

  main{padding:58px 0 110px}
  .shelf{margin-bottom:68px;padding-bottom:30px;border-bottom:1px solid rgba(213,166,73,.10);position:relative}
  .shelf::after{content:'';position:absolute;left:0;right:0;bottom:0;height:12px;background:linear-gradient(180deg,rgba(68,43,21,.32),rgba(20,14,8,.55));box-shadow:0 8px 18px rgba(0,0,0,.35)}
  .shelf__header{display:flex;align-items:center;gap:18px;margin-bottom:28px}
  .shelf__label{font-family:'Fraunces',serif;font-size:28px;letter-spacing:-.01em;color:#e7c879;white-space:nowrap}
  .shelf__count{font-family:'JetBrains Mono',monospace;font-size:10px;color:#7e7b6d;border:1px solid rgba(213,166,73,.16);padding:3px 7px;border-radius:999px}
  .shelf__rule{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}

  .carousel{position:relative}
  .carousel__viewport{overflow-x:auto;scroll-behavior:smooth;scroll-snap-type:x proximity;padding:2px 4px 14px 2px;scrollbar-width:none;-ms-overflow-style:none}
  .carousel__viewport::-webkit-scrollbar{display:none}
  .carousel__track{display:flex;gap:24px;align-items:flex-start;width:max-content;min-width:100%}
  .carousel__btn{position:absolute;top:38%;transform:translateY(-50%);width:42px;height:42px;border-radius:999px;border:1px solid rgba(213,166,73,.28);background:rgba(11,12,11,.88);color:var(--gold-2);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 12px 25px rgba(0,0,0,.38);transition:.2s ease;z-index:4}
  .carousel__btn:hover{background:rgba(18,19,17,.98);border-color:rgba(241,196,107,.42);transform:translateY(-50%) scale(1.04)}
  .carousel__btn[disabled]{opacity:.28;cursor:default;pointer-events:none}
  .carousel__btn.prev{left:-14px}
  .carousel__btn.next{right:-14px}
  .carousel__btn.is-hidden{display:none}
  .tile{position:relative;cursor:pointer;aspect-ratio:2/3;border-radius:2px;overflow:hidden;background:#171a16;box-shadow:0 22px 32px -18px rgba(0,0,0,.9),0 0 0 1px rgba(213,166,73,.18);transform:translateY(0);transition:transform .28s ease,box-shadow .28s ease}
  .tile::after{content:'';position:absolute;inset:0;box-shadow:inset 0 0 28px rgba(0,0,0,.24);pointer-events:none}
  .tile:hover{transform:translateY(-7px);box-shadow:0 30px 40px -18px rgba(0,0,0,.95),0 0 0 1px rgba(241,196,107,.38)}
  .tile img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .45s ease,filter .45s ease}
  .tile:hover img{transform:scale(1.045);filter:brightness(.48) saturate(.82)}
  .tile__fold{position:absolute;top:0;right:0;width:0;height:0;border-style:solid;border-color:var(--gold) transparent transparent transparent;filter:drop-shadow(-2px 2px 2px rgba(0,0,0,.45));pointer-events:none;z-index:4;transform:rotate(90deg)}
  .tile__status{position:absolute;top:9px;left:9px;z-index:4;font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:.12em;text-transform:uppercase;background:#d8b35b;color:#15130d;padding:4px 7px;border-radius:1px;box-shadow:0 4px 10px rgba(0,0,0,.35)}
  .tile__overlay{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;justify-content:flex-end;padding:15px;opacity:0;transform:translateY(8px);transition:.3s ease;background:linear-gradient(to top,rgba(5,6,5,.98) 5%,rgba(5,6,5,.76) 42%,transparent 78%)}
  .tile:hover .tile__overlay,.tile:focus .tile__overlay{opacity:1;transform:none}
  .tile__title{font-family:'Fraunces',serif;font-size:18px;line-height:1.15;color:#f3dfad}
  .tile__author{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.03em;color:#aaa58f;margin-top:6px}

  .book-card{min-width:0;flex:0 0 clamp(150px,15vw,178px);scroll-snap-align:start}
  .book-card .tile{width:100%}
  .book-meta{padding:12px 3px 0;text-align:center}
  .book-meta__title{font-family:'Fraunces',serif;font-size:16px;line-height:1.15;color:#ead39a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .book-meta__author{font-family:'JetBrains Mono',monospace;font-size:8.5px;color:#77786f;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rating-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px}
  .stars{display:flex;align-items:center;gap:2px;line-height:1;user-select:none}
  .star{position:relative;width:18px;height:18px;display:inline-block;color:#4e493c;flex:0 0 18px}
  .star::before{content:'★';position:absolute;inset:0;font-size:17px;line-height:18px;color:#4e493c}
  .star__fill{position:absolute;left:0;top:0;height:100%;overflow:hidden;pointer-events:none;color:var(--gold-2)}
  .star__fill::before{content:'★';display:block;width:18px;font-size:17px;line-height:18px;color:var(--gold-2);text-shadow:0 0 9px rgba(241,196,107,.14)}
  .star__half{position:absolute;top:0;bottom:0;width:50%;z-index:2;border:0;background:transparent;cursor:pointer;padding:0}
  .star__half.left{left:0}.star__half.right{right:0}
  .stars.readonly .star__half{display:none}
  .rating-value{font-family:'JetBrains Mono',monospace;font-size:9px;color:#8f8a78;min-width:22px;text-align:left}
  .modal__rating{display:flex;align-items:center;gap:11px;margin:0 0 22px}
  .modal__rating .stars{gap:4px}
  .modal__rating .star{width:25px;height:25px;flex-basis:25px}
  .modal__rating .star::before,.modal__rating .star__fill::before{font-size:24px;line-height:25px;width:25px}
  .modal__rating .rating-value{font-size:11px;color:#aaa38f;min-width:34px}
  .rating-hint{font-family:'JetBrains Mono',monospace;font-size:8.5px;color:#67695f;margin-top:5px;text-align:center}

  .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(9px);display:flex;align-items:center;justify-content:center;padding:24px;z-index:80}
  .modal{background:linear-gradient(145deg,#171914,#0f110e);color:var(--ink);max-width:780px;width:100%;border:1px solid rgba(213,166,73,.28);border-radius:2px;padding:34px;display:flex;gap:30px;position:relative;max-height:86vh;overflow-y:auto;box-shadow:0 36px 90px rgba(0,0,0,.65)}
  .modal img{width:175px;flex-shrink:0;border-radius:2px;box-shadow:0 16px 35px rgba(0,0,0,.5)}
  .modal__title{font-family:'Fraunces',serif;font-size:32px;line-height:1.05;color:#f0d596;margin:7px 28px 5px 0}
  .modal__author{font-family:'JetBrains Mono',monospace;font-size:11px;color:#918e80;margin-bottom:22px}
  .modal__thoughts{font-family:'Fraunces',serif;font-size:18px;line-height:1.7;color:#ddd2b8}
  .modal__close{position:absolute;top:14px;right:16px;background:none;border:0;font-size:16px;cursor:pointer;color:#9c9889;transition:.2s}
  .modal__close:hover{color:var(--gold-2)}
  .empty-note{font-family:'JetBrains Mono',monospace;font-size:12px;color:#74756f}

  @media(max-width:720px){
    .wrap{padding:0 20px}.topbar{height:64px}.topbar::after{display:none}.library-hero{min-height:310px}.library-hero h1{font-size:52px}.library-hero p{font-size:16px}.shelf__label{font-size:24px}.modal{display:block;padding:26px}.modal img{width:120px;margin-bottom:20px}.modal__title{font-size:27px}.book-meta__title{font-size:14px}.book-meta__author{font-size:8px}.book-card{flex-basis:140px}.carousel__track{gap:16px}.carousel__btn{width:36px;height:36px;top:34%}.carousel__btn.prev{left:-8px}.carousel__btn.next{right:-8px}
  }
</style>
</head>
<body>

<div class="topbar wrap">
  <a class="back-link" href="https://utkarshsingh26.github.io/">← Back to portfolio</a>
</div>

<section class="library-hero wrap">
  <div class="eyebrow">The Library</div>
  <h1>What I've Read</h1>
  <p>Every dog-ear is a rating I gave it myself — the bigger the fold, the more I loved it. You can also rate each book in half-star increments. Click any cover for my thoughts.</p>
</section>

<main class="wrap">
  <div id="shelves"></div>
</main>

<div id="modal-root"></div>

<script>
  // ---------------- Sample data ----------------
  // Add a books.json next to this file (same shape as below) and it's
  // used automatically instead. Shelves are whatever "shelf" values
  // show up in the data — Cosmere, Dungeon Crawler Carl, Harry Potter,
  // Sci-Fi, whatever you want. No fixed list to maintain.
  const SAMPLE_BOOKS = [
    { title: "Mistborn", author: "Brandon Sanderson", shelf: "Cosmere", rating: 5,
      cover: "https://mpd-biblio-covers.imgix.net/9781250868282.jpg?w=900&dpr=2",
      thoughts: "The magic system alone would carry a weaker book. Vin's arc is what makes it great." },
    { title: "The Well of Ascencion", author: "Brandon Sanderson", shelf: "Cosmere", rating: 5,
      cover: "https://mpd-biblio-covers.imgix.net/9781250868299.jpg?w=900&dpr=2",
      thoughts: "Most people don't like this one, but I like the premise of a political chess book with the flair of wanting to build a better empire." },
    { title: "The Hero of Ages", author: "Brandon Sanderson", shelf: "Cosmere", rating: 5,
      cover: "https://mpd-biblio-covers.imgix.net/9781250868312.jpg?w=900&dpr=2",
      thoughts: "What an ending to the story. Sazed, Vin, and Elend all shine!" },
    { title: "Mistborn: Secret History", author: "Brandon Sanderson", shelf: "Cosmere", rating: 5,
      cover: "https://mpd-biblio-covers.imgix.net/9781250430755.jpg?w=900&dpr=2",
      thoughts: "Really puts Kelsier's heroic status into question. But connections with events of Books 1, 2, and 3 are excellent!" },
    { title: "The Alloy of Law", author: "Brandon Sanderson", shelf: "Cosmere", rating: 5,
      cover: "https://mpd-biblio-covers.imgix.net/9781250860002.jpg?w=900&dpr=2",
      thoughts: "Not very good. I'd have stopped reading Era 2 if the name Mistborn wasn't attached to it." },
    { title: "Shadows of Self", author: "Brandon Sanderson", shelf: "Cosmere", rating: 5,
      cover: "https://mpd-biblio-covers.imgix.net/9781466862661.jpg?w=900&dpr=2",
      thoughts: "Really gets you in the groove. Would've hit harder if we'd spent more time with Wax and Wayne." },
    { title: "The Bands of Mourning", author: "Brandon Sanderson", shelf: "Cosmere", rating: 5,
      cover: "https://m.media-amazon.com/images/S/compressed.photo.goodreads.com/books/1730639847i/18739426.jpg",
      thoughts: "WHAT THE F WAS THAT AT THE END?!" },
    { title: "The Lost Metal", author: "Brandon Sanderson", shelf: "Cosmere", rating: 5,
      cover: "https://mpd-biblio-covers.imgix.net/9780765391209.jpg?w=900&dpr=2",
      thoughts: "Truly a great way of going out with a bang." },
    { title: "Elantris", author: "Brandon Sanderson", shelf: "Cosmere", rating: 5,
      cover: "https://mpd-biblio-covers.imgix.net/9780765350374.jpg?w=900&dpr=2",
      thoughts: "Gets unnecessary hate but to me, is an old school fantasy. I LOVED it!" },
    { title: "Tress of the Emerald Sea", author: "Brandon Sanderson", shelf: "Cosmere", rating: 5,
      cover: "https://mpd-biblio-covers.imgix.net/9781250899668.jpg?w=900&dpr=2",
      thoughts: "Pretty cozy. But I don't agree with Brando Sando that it's a good entry point to the Cosmere" },
    { title: "The Way of Kings", author: "Brandon Sanderson", shelf: "Cosmere", rating: 5,
      cover: "https://mpd-biblio-covers.imgix.net/9780765376671.jpg?w=900&dpr=2",
      thoughts: "My first 1000 page book! And honestly it doesn't feel as long as it is. What a story, excellent character work! Can't wait to dive in to the rest of Stormlight!" },
    { title: "Warbreaker", author: "Brandon Sanderson", shelf: "Cosmere", rating: 4,
      cover: "http://mpd-biblio-covers.imgix.net/9781250430694.jpg?w=900&dpr=2",
      thoughts: "Not bad but not as good as some other Cosmere entries" },
    { title: "Words of Radiance", author: "Brandon Sanderson", shelf: "Cosmere", rating: 0, status: "reading",
      cover: "https://mpd-biblio-covers.imgix.net/9780765326362.jpg?w=900&dpr=2",
      thoughts: "pg. 267 / 1080 — Prologue was solid!" },
    { title: "Dungeon Crawler Carl", author: "Matt Dinniman", shelf: "Dungeon Crawler Carl Series", rating: 5,
      cover: "https://i0.wp.com/mattdinniman.com/wp-content/uploads/2026/05/Book-1-Ace-cover-scaled.jpg?ssl=1g",
      thoughts: "Absurd premise, takes a while to get into, but is decent. I've heard the second book is really great." },
    { title: "Fifty Fifty", author: "Steve Cavanagh", shelf: "Eddie Flynn Series", rating: 0,
      cover: "https://d28hgpri8am2if.cloudfront.net/book_images/onix/cvr9781668093450/fifty-fifty-9781668093450_lg.jpg",
      thoughts: "The twist at the end is good. The book was somewhat engaging but the actual trial didn't feel as exciting, perhaps cause I'm used to Sanderson's writing and he's on a different level." },
    { title: "The Man with a Thousand Faces", author: "Lex Noteboom", shelf: "On my TBR", rating: 4,
      cover: "https://www.hachettebookgroup.com/wp-content/uploads/2025/04/9781454958246_c0d164.jpg?resize=1017,1536",
      thoughts: "TBR" },
    { title: "The Three Body Problem", author: "Liu Cixin", shelf: "On my TBR", rating: 4,
      cover: "https://mpd-biblio-covers.imgix.net/9780765382030.jpg?w=900&dpr=2",
      thoughts: "TBR" },
    { title: "The Dark Forest", author: "Liu Cixin", shelf: "On my TBR", rating: 4,
      cover: "https://mpd-biblio-covers.imgix.net/9780765386694.jpg?w=900&dpr=2",
      thoughts: "TBR" },
    { title: "Death's End", author: "Liu Cixin", shelf: "On my TBR", rating: 4,
      cover: "https://mpd-biblio-covers.imgix.net/9780765386632.jpg?w=900&dpr=2",
      thoughts: "TBR" },
    { title: "Yumi and the Nightmare Painter", author: "Brandon Sanderson", shelf: "On my TBR", rating: 4,
      cover: "https://mpd-biblio-covers.imgix.net/9781250899699.jpg?w=900&dpr=2",
      thoughts: "TBR" }
  ];

  const shelvesRoot = document.getElementById('shelves');
  const modalRoot = document.getElementById('modal-root');

  function groupByShelf(books){
    const groups = {};
    books.forEach(b=>{
      const shelf = (b.shelf || 'Others').trim();
      (groups[shelf] = groups[shelf] || []).push(b);
    });
    return groups;
  }
  // "Currently reading" books float to the top of their shelf; shelves
  // themselves appear in the order they're first seen in the data, so
  // you control ordering just by how you arrange books.json.
  function orderedShelfNames(groups){
    return Object.keys(groups);
  }
  function foldSize(rating){
    const r = Number(rating) || 0;
    return r <= 0 ? 0 : Math.round(9 + (r / 5) * 29);
  }

  let currentBooks = [];
  const RATINGS_KEY = 'utkarsh-library-ratings-v1';

  function bookKey(book){
    return `${book.shelf || ''}::${book.title || ''}::${book.author || ''}`;
  }

  function getSavedRatings(){
    try { return JSON.parse(localStorage.getItem(RATINGS_KEY) || '{}'); }
    catch { return {}; }
  }

  function applySavedRatings(books){
    const saved = getSavedRatings();
    books.forEach(book=>{
      const key = bookKey(book);
      if(Object.prototype.hasOwnProperty.call(saved,key)) book.rating = Number(saved[key]);
    });
    return books;
  }

  function saveRating(book, rating){
    const normalized = Math.max(.5, Math.min(5, Math.round(Number(rating) * 2) / 2));
    book.rating = normalized;
    const saved = getSavedRatings();
    saved[bookKey(book)] = normalized;
    localStorage.setItem(RATINGS_KEY, JSON.stringify(saved));
    return normalized;
  }

  function starsMarkup(rating, interactive=true){
    const value = Math.max(0, Math.min(5, Number(rating) || 0));
    let html = `<div class="stars${interactive ? '' : ' readonly'}" role="${interactive ? 'radiogroup' : 'img'}" aria-label="${value ? `${value} out of 5 stars` : 'Not rated'}">`;
    for(let i=1;i<=5;i++){
      const fill = Math.max(0, Math.min(1, value - (i-1))) * 100;
      html += `<span class="star" data-star="${i}">
        <span class="star__fill" style="width:${fill}%"></span>
        ${interactive ? `<button class="star__half left" type="button" data-rating="${i-.5}" aria-label="Rate ${i-.5} out of 5"></button><button class="star__half right" type="button" data-rating="${i}" aria-label="Rate ${i} out of 5"></button>` : ''}
      </span>`;
    }
    html += `</div>`;
    return html;
  }

  function wireRatingControl(root, book, onChange){
    root.querySelectorAll('.star__half').forEach(btn=>{
      btn.addEventListener('click', e=>{
        e.preventDefault();
        e.stopPropagation();
        const value = saveRating(book, Number(btn.dataset.rating));
        if(onChange) onChange(value);
      });
    });
  }

  function renderTile(book){
    const card = document.createElement('div');
    card.className = 'book-card';
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.tabIndex = 0;
    tile.setAttribute('role','button');
    tile.setAttribute('aria-label', `${book.title} by ${book.author}`);
    const fold = foldSize(book.rating);
    tile.innerHTML = `
      <img src="${book.cover || 'https://placehold.co/240x360?text=No+Cover'}" alt="${book.title} cover" loading="lazy" />
      ${book.status === 'reading' ? `<span class="tile__status">Reading</span>` : ''}
      ${fold > 0 ? `<span class="tile__fold" style="border-width:${fold}px ${fold}px 0 0;"></span>` : ''}
      <div class="tile__overlay">
        <p class="tile__title">${book.title}</p>
        <p class="tile__author">${book.author}</p>
      </div>
    `;
    const meta = document.createElement('div');
    meta.className = 'book-meta';
    meta.innerHTML = `
      <p class="book-meta__title" title="${book.title}">${book.title}</p>
      <p class="book-meta__author" title="${book.author}">${book.author}</p>
      <div class="rating-row">
        ${starsMarkup(book.rating, true)}
        <span class="rating-value">${book.rating ? Number(book.rating).toFixed(1) : '—'}</span>
      </div>
    `;
    const open = ()=> openModal(book);
    tile.addEventListener('click', open);
    tile.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();open();} });
    wireRatingControl(meta, book, value=>{
      render(currentBooks);
    });
    card.append(tile, meta);
    return card;
  }

  function renderShelf(name, books){
    const shelf = document.createElement('section');
    shelf.className = 'shelf';
    shelf.innerHTML = `
      <div class="shelf__header">
        <span class="shelf__label">${name}</span>
        <span class="shelf__count">${books.length}</span>
        <span class="shelf__rule"></span>
      </div>
    `;

    const carousel = document.createElement('div');
    carousel.className = 'carousel';
    carousel.innerHTML = `
      <button class="carousel__btn prev" type="button" aria-label="Scroll ${name} left">←</button>
      <div class="carousel__viewport">
        <div class="carousel__track"></div>
      </div>
      <button class="carousel__btn next" type="button" aria-label="Scroll ${name} right">→</button>
    `;

    const track = carousel.querySelector('.carousel__track');
    books.slice()
      .sort((a,b)=>{
        if(a.status==='reading' && b.status!=='reading') return -1;
        if(b.status==='reading' && a.status!=='reading') return 1;
        return new Date(b.dateAdded||0) - new Date(a.dateAdded||0);
      })
      .forEach(b=> track.appendChild(renderTile(b)));

    shelf.appendChild(carousel);
    setupCarousel(carousel);
    return shelf;
  }

  function setupCarousel(carousel){
    const viewport = carousel.querySelector('.carousel__viewport');
    const prev = carousel.querySelector('.carousel__btn.prev');
    const next = carousel.querySelector('.carousel__btn.next');

    const scrollAmount = ()=> Math.max(280, Math.floor(viewport.clientWidth * 0.82));

    prev.addEventListener('click', ()=>{
      viewport.scrollBy({ left: -scrollAmount(), behavior: 'smooth' });
    });
    next.addEventListener('click', ()=>{
      viewport.scrollBy({ left: scrollAmount(), behavior: 'smooth' });
    });

    const updateButtons = ()=>{
      const maxScroll = viewport.scrollWidth - viewport.clientWidth;
      const hasOverflow = maxScroll > 12;
      prev.classList.toggle('is-hidden', !hasOverflow);
      next.classList.toggle('is-hidden', !hasOverflow);
      prev.disabled = viewport.scrollLeft <= 8;
      next.disabled = viewport.scrollLeft >= maxScroll - 8;
    };

    viewport.addEventListener('scroll', updateButtons, { passive: true });
    window.addEventListener('resize', updateButtons);
    requestAnimationFrame(updateButtons);
  }

  function render(books){
    currentBooks = books;
    shelvesRoot.innerHTML = '';
    if(!books || !books.length){
      shelvesRoot.innerHTML = `<p class="empty-note">No books yet — add some to books.json.</p>`;
      return;
    }
    const groups = groupByShelf(books);
    orderedShelfNames(groups).forEach(name=>{
      shelvesRoot.appendChild(renderShelf(name, groups[name]));
    });
  }

  function openModal(book){
    const backdrop = document.createElement('div');
    backdrop.className = 'backdrop';
    backdrop.innerHTML = `
      <div class="modal">
        <button class="modal__close" aria-label="Close">✕</button>
        <img src="${book.cover || 'https://placehold.co/240x360?text=No+Cover'}" alt="${book.title} cover" />
        <div>
          <p class="modal__title">${book.title}</p>
          <p class="modal__author">${book.author}${book.publishedDate ? ` · ${book.publishedDate}` : ''}</p>
          <div class="modal__rating">
            ${starsMarkup(book.rating, true)}
            <span class="rating-value">${book.rating ? Number(book.rating).toFixed(1) : 'Not rated'}</span>
          </div>
          <p class="modal__thoughts">${book.thoughts ? book.thoughts : 'No notes yet.'}</p>
        </div>
      </div>
    `;
    const close = ()=> backdrop.remove();
    backdrop.addEventListener('click', e=>{ if(e.target===backdrop) close(); });
    backdrop.querySelector('.modal__close').addEventListener('click', close);
    wireRatingControl(backdrop, book, value=>{
      const ratingWrap = backdrop.querySelector('.modal__rating');
      ratingWrap.innerHTML = `${starsMarkup(value, true)}<span class="rating-value">${value.toFixed(1)}</span>`;
      wireRatingControl(ratingWrap, book, ()=>{ render(currentBooks); close(); openModal(book); });
      render(currentBooks);
    });
    document.addEventListener('keydown', function onEsc(e){
      if(e.key==='Escape'){ close(); document.removeEventListener('keydown', onEsc); }
    });
    modalRoot.appendChild(backdrop);
  }

  fetch('./books.json')
    .then(res=>{ if(!res.ok) throw new Error('no books.json'); return res.json(); })
    .then(books=> render(applySavedRatings(books)))
    .catch(()=> render(applySavedRatings(SAMPLE_BOOKS)));
</script>

</body>
</html>
